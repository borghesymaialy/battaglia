<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battaglia navale</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --paper:#EDF0F2; --panel:#FFFFFF; --ink:#16242F; --ink-soft:#5A6B78;
  --line:#C6D0D8; --sea:#DDE5EA; --ship:#2E4A5C; --miss:#94A7B4;
  --hit:#9B3226; --sunk:#5C1F17; --turn:#1E6B5A;
  --radar-found:#E7C9B8; --radar-clear:#CFE0D8;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
#app{max-width:1200px;margin:0 auto;padding:16px;}
.title-lg{font-family:"Iowan Old Style",Palatino,"Palatino Linotype",Georgia,serif;font-size:30px;line-height:1.15;margin:0;}
.title-md{font-family:"Iowan Old Style",Palatino,"Palatino Linotype",Georgia,serif;font-size:19px;margin:0 0 6px 0;}
.title-xl{font-family:"Iowan Old Style",Palatino,"Palatino Linotype",Georgia,serif;font-size:26px;letter-spacing:0.01em;margin:0;}
.muted{color:var(--ink-soft);font-size:14px;line-height:1.5;margin:4px 0;}
.muted.small{font-size:13px;}
.err{color:var(--hit);font-size:14px;margin-top:14px;}
.label{display:block;margin-top:22px;font-size:14px;color:var(--ink-soft);}
.label-strong{color:var(--ink);font-size:13px;margin:10px 0 2px 0;}

.home-wrap{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.home-card{background:var(--panel);border:1px solid var(--line);max-width:430px;width:100%;padding:28px;}
.code-input{width:100%;margin-top:4px;padding:9px 12px;border:1px solid var(--line);background:var(--paper);
  font-family:"Iowan Old Style",Palatino,"Palatino Linotype",Georgia,serif;font-size:24px;letter-spacing:0.2em;color:var(--ink);outline:none;}

.row{display:flex;align-items:center;}
.row.gap{gap:8px;}
.row.wrap{flex-wrap:wrap;}
.row.space-between{justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;}

.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 16px;font-size:14px;cursor:pointer;}
.btn-dark{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.btn-outline{background:var(--panel);}
.btn-block{width:100%;margin-top:14px;}
.btn-disabled{background:var(--line);color:var(--ink-soft);cursor:default;}
.btn:disabled{cursor:default;}

.app-header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px;}
.app-header .meta{display:flex;gap:16px;font-size:14px;color:var(--ink-soft);}
.app-header strong{color:var(--ink);letter-spacing:0.12em;}

.cols{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start;}
.panel-side{max-width:320px;width:100%;}
.sunk-panel{min-width:200px;}

.ship-list{list-style:none;margin:14px 0 0 0;padding:0;}
.ship-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink-soft);}
.ship-row.current{color:var(--ink);}
.ship-size{margin-left:8px;font-size:11px;color:var(--ink-soft);}
.tally-block{margin-bottom:16px;}
.tally-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line);font-size:12px;color:var(--ink);}
.tally-done{color:var(--ink-soft);opacity:0.55;}
.tally-size{margin-left:6px;font-size:10px;color:var(--ink-soft);}

.status-bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:18px;padding:8px 12px;
  background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);font-size:14px;}
.status-count{margin-left:auto;}

.mode-btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 14px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px;}
.mode-btn.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.mode-btn.disabled,.mode-btn:disabled{color:var(--line);cursor:default;}
.mode-btn .count{font-size:11px;min-width:14px;text-align:center;}

.grid-wrap{width:100%;}
.grid{display:grid;grid-template-columns:1.5rem repeat(30,1fr);gap:1px;}
.colhead,.rowhead{font-size:8px;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;padding-bottom:2px;}
.rowhead{justify-content:flex-end;padding-right:3px;}
.cell{aspect-ratio:1/1;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  padding:0;font-size:8px;margin:0;}
.cell-live{cursor:pointer;}
.cell-live:hover{outline:2px solid var(--ink);outline-offset:-2px;filter:brightness(0.92);}
ul{margin:4px 0;padding-left:18px;font-size:13px;}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============ CONFIGURAZIONE SUPABASE ============ */
const SUPABASE_URL = "https://rmvhmjrdwaijqsjwjzuz.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_qa3fbykC0uusiBpqI6wDaQ_gk4cm2Dj";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ============ griglia e flotta ============ */
const N = 30;
function colLabel(index){
  let i = index + 1, s = "";
  while (i > 0) { const rem = (i - 1) % 26; s = String.fromCharCode(65 + rem) + s; i = Math.floor((i - 1) / 26); }
  return s;
}
const COLS = Array.from({ length: N }, (_, i) => colLabel(i));
const cellName = (i) => COLS[i % N] + (Math.floor(i / N) + 1);

function rep(n, name, size){ return Array.from({ length: n }, () => ({ name, size })); }
const FLEET = [
  ...rep(2, "Portaerei", 6),
  ...rep(3, "Corazzata", 5),
  ...rep(5, "Incrociatore", 4),
  ...rep(6, "Cacciatorpediniere", 3),
  ...rep(8, "Sottomarino", 2),
  ...rep(10, "Vedetta", 1),
];
const TOT = FLEET.reduce((a, s) => a + s.size, 0);
const FLEET_GROUPS = (() => {
  const groups = [];
  FLEET.forEach((s, i) => {
    const last = groups[groups.length - 1];
    if (last && last.name === s.name && last.size === s.size) { last.count++; last.end = i; }
    else groups.push({ name: s.name, size: s.size, count: 1, start: i, end: i });
  });
  return groups;
})();
const BOMBS_MAX = 5;
const RADAR_MAX = 3;
const RADAR_SIZE = 5;
const MULTI_MAX = 1;
const MULTI_ZONE = 15;
const MULTI_SHOTS = 15;
const TORPEDO_MAX = 2;
const SHEEP_MAX = 2;
const SHEEP_HOPS = 4;
const DIRS = [
  { dr: -1, dc: 0, nome: "verso l'alto" },
  { dr: 1, dc: 0, nome: "verso il basso" },
  { dr: 0, dc: -1, nome: "verso sinistra" },
  { dr: 0, dc: 1, nome: "verso destra" },
];

function emptyFleetState(){ return { cells: {}, ships: [] }; }
function canPlace(cells, start, size, horiz){
  const r = Math.floor(start / N), c = start % N;
  if (horiz && c + size > N) return null;
  if (!horiz && r + size > N) return null;
  const out = [];
  for (let k = 0; k < size; k++) {
    const idx = horiz ? start + k : start + k * N;
    if (cells[idx] !== undefined) return null;
    out.push(idx);
  }
  return out;
}
function randomFleet(){
  for (let attempt = 0; attempt < 200; attempt++) {
    const cells = {}, ships = [];
    let ok = true;
    for (let s = 0; s < FLEET.length; s++) {
      let placed = false;
      for (let t = 0; t < 500 && !placed; t++) {
        const start = Math.floor(Math.random() * N * N);
        const horiz = Math.random() < 0.5;
        const got = canPlace(cells, start, FLEET[s].size, horiz);
        if (got) { got.forEach((i) => (cells[i] = s)); ships.push({ id: s, name: FLEET[s].name, size: FLEET[s].size, cells: got }); placed = true; }
      }
      if (!placed) { ok = false; break; }
    }
    if (ok) return { cells, ships };
  }
  return emptyFleetState();
}
/* area quadrata di lato "size" centrata (il più possibile) sulla cella idx.
   per lati pari (es. 8) la cella scelta resta 3 posizioni dopo l'inizio e 4 prima della fine,
   quindi leggermente sbilanciata verso il basso/destra: variazione impercettibile in partita. */
function boxSquare(idx, size){
  const before = Math.floor((size - 1) / 2);
  const after = size - 1 - before;
  const r = Math.floor(idx / N), c = idx % N, out = [];
  for (let dr = -before; dr <= after; dr++) for (let dc = -before; dc <= after; dc++) {
    const rr = r + dr, cc = c + dc;
    if (rr >= 0 && rr < N && cc >= 0 && cc < N) out.push(rr * N + cc);
  }
  return out;
}
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function torpedoPath(start, dir, oppCells, sunkSet){
  const r0 = Math.floor(start / N), c0 = start % N, path = [];
  for (let k = 0; k < N; k++) {
    const rr = r0 + dir.dr * k, cc = c0 + dir.dc * k;
    if (rr < 0 || rr >= N || cc < 0 || cc >= N) break;
    const idx = rr * N + cc;
    path.push(idx);
    if (oppCells[idx] !== undefined && !sunkSet.has(idx)) break;
  }
  return path;
}
function torpedoCross(idx){
  const r0 = Math.floor(idx / N), c0 = idx % N, out = [];
  for (let c = 0; c < N; c++) out.push(r0 * N + c);
  for (let r = 0; r < N; r++) out.push(r * N + c0);
  return out;
}
function computeTurn(actionsA, actionsB, starter){
  let i = 0, j = 0, turn = starter;
  for (let guard = 0; guard < 2000; guard++) {
    if (turn === "p1") { if (i >= actionsA.length) break; if (actionsA[i++].endsTurn) turn = "p2"; }
    else { if (j >= actionsB.length) break; if (actionsB[j++].endsTurn) turn = "p1"; }
  }
  return turn;
}
function summarizeActions(actions){
  const resolved = new Map(), hitSet = new Set();
  actions.forEach((a) => {
    if (a.type === "radar") return; // pura ricognizione, non risolve celle
    a.cells.forEach((c) => {
      if (resolved.get(c) === true) return;
      const isHit = a.hitCells.includes(c);
      resolved.set(c, isHit);
      if (isHit) hitSet.add(c);
    });
  });
  return { resolved, hitSet };
}
function radarOverlay(actions, oppFleetCells, hitSet){
  const map = new Map();
  actions.forEach((a) => {
    if (a.type !== "radar") return;
    if (a.found && oppFleetCells) {
      const stillHidden = a.cells.some((c) => oppFleetCells[c] !== undefined && !hitSet.has(c));
      if (!stillHidden) return; // tutte le navi dell'area sono state colpite: radar esaurito
    }
    a.cells.forEach((c) => { if (a.found) map.set(c, "found"); else if (map.get(c) !== "found") map.set(c, "clear"); });
  });
  return map;
}
function sunkShips(defFleet, hitSet){ return defFleet.ships.filter((sh) => sh.cells.every((c) => hitSet.has(c))); }
function keyFor(code, role){ return `bn:${code}:${role}`; }
function randomCode(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = ""; for (let i = 0; i < 4; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}

/* ============ persistenza (Supabase) ============ */
async function sbGet(key){
  try {
    const { data, error } = await sb.from("bn_state").select("value").eq("key", key).maybeSingle();
    if (error) { console.error(error); return null; }
    return data ? data.value : null;
  } catch (e) { console.error(e); return null; }
}
async function sbSet(key, value){
  try {
    const { error } = await sb.from("bn_state").upsert({ key, value, updated_at: new Date().toISOString() });
    if (error) console.error(error);
    return !error;
  } catch (e) { console.error(e); return false; }
}
let savingMe = false;
let pendingMeSave = false;
async function saveMe(){
  if (!state.me || !state.role || !state.code) return;
  if (savingMe) { pendingMeSave = true; return; }
  savingMe = true;
  await sbSet(keyFor(state.code, state.role), state.me);
  savingMe = false;
  if (pendingMeSave) {
    pendingMeSave = false;
    saveMe(); // c'era un cambiamento nel frattempo: rispedisco lo stato più recente
  }
}

/* ============ stato applicazione ============ */
const state = {
  screen: "home", code: "", role: null,
  clientId: Math.random().toString(36).slice(2, 10) + Date.now().toString(36),
  me: null, opp: null, msg: "", busy: false,
  placeIdx: 0, horiz: true, draft: emptyFleetState(),
  mode: "fire", suggested: randomCode(), codeInputVal: "",
  pollTimer: null, lastOppJSON: null,
};

function computeDerived(){
  const me = state.me, opp = state.opp;
  const bothReady = !!(me && me.ready && opp && opp.ready);
  const starter = me && me.round % 2 === 1 ? "p1" : "p2";
  const myActions = me ? me.actions : [];
  const oppActions = opp ? opp.actions : [];
  const turnNow = bothReady
    ? computeTurn(state.role === "p1" ? myActions : oppActions, state.role === "p1" ? oppActions : myActions, starter)
    : null;
  const mySummary = summarizeActions(myActions);
  const oppSummary = summarizeActions(oppActions);
  const myHits = mySummary.hitSet.size;
  const oppHits = oppSummary.hitSet.size;
  const winner = myHits >= TOT ? state.role : oppHits >= TOT ? (state.role === "p1" ? "p2" : "p1") : null;
  const mySunk = opp && opp.fleet ? sunkShips(opp.fleet, mySummary.hitSet) : [];
  const lostSunk = me && me.fleet ? sunkShips(me.fleet, oppSummary.hitSet) : [];
  const bombsLeft = me ? BOMBS_MAX - myActions.filter((a) => a.type === "bomb").length : 0;
  const radarLeft = me ? RADAR_MAX - myActions.filter((a) => a.type === "radar").length : 0;
  const multiLeft = me ? MULTI_MAX - myActions.filter((a) => a.type === "multi").length : 0;
  const torpedoLeft = me ? TORPEDO_MAX - myActions.filter((a) => a.type === "torpedo").length : 0;
  const sheepLeft = me ? SHEEP_MAX - myActions.filter((a) => a.type === "sheep").length : 0;
  const myTurn = bothReady && turnNow === state.role && !winner;
  return { bothReady, turnNow, mySummary, oppSummary, myHits, oppHits, winner, mySunk, lostSunk, bombsLeft, radarLeft, multiLeft, torpedoLeft, sheepLeft, myTurn };
}

/* ============ azioni di gioco ============ */
async function join(rawCode){
  const cd = (rawCode || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
  if (cd.length < 3) { state.msg = "Il codice deve avere almeno 3 caratteri."; render(); return; }
  state.busy = true; state.msg = ""; render();

  const fresh = { clientId: state.clientId, round: 1, wantRound: 1, fleet: emptyFleetState(), actions: [], ready: false };
  let mine = null;
  const p1 = await sbGet(keyFor(cd, "p1"));
  if (!p1 || p1.clientId === state.clientId) { mine = "p1"; if (!p1) await sbSet(keyFor(cd, "p1"), fresh); }
  else {
    const p2 = await sbGet(keyFor(cd, "p2"));
    if (!p2 || p2.clientId === state.clientId) { mine = "p2"; if (!p2) await sbSet(keyFor(cd, "p2"), fresh); }
    else { state.busy = false; state.msg = "Questa partita ha già due giocatori. Usate un altro codice."; render(); return; }
  }

  if (!p1 && mine === "p1") {
    await new Promise((r) => setTimeout(r, 1200));
    const check = await sbGet(keyFor(cd, "p1"));
    if (check && check.clientId !== state.clientId) {
      const p2 = await sbGet(keyFor(cd, "p2"));
      if (!p2 || p2.clientId === state.clientId) { mine = "p2"; await sbSet(keyFor(cd, "p2"), fresh); }
      else { state.busy = false; state.msg = "Posto occupato mentre entravi. Riprova con un altro codice."; render(); return; }
    }
  }

  const existing = await sbGet(keyFor(cd, mine));
  const st = existing && existing.clientId === state.clientId ? existing : fresh;

  state.code = cd; state.role = mine; state.me = st;
  state.draft = st.fleet || emptyFleetState();
  state.placeIdx = st.fleet && st.fleet.ships ? st.fleet.ships.length : 0;
  state.screen = st.ready ? "game" : "setup";
  state.busy = false;
  render();
  startPolling();
}

function startPolling(){
  if (state.pollTimer) return;
  pollOpp();
  state.pollTimer = setInterval(pollOpp, 1500);
}
async function pollOpp(){
  if (!state.role || !state.code) return;
  const other = state.role === "p1" ? "p2" : "p1";
  const data = await sbGet(keyFor(state.code, other));
  if (data) {
    const j = JSON.stringify(data);
    if (j !== state.lastOppJSON) { state.lastOppJSON = j; state.opp = data; handleRematchSync(); render(); }
  }
}
function handleRematchSync(){
  if (!state.me || !state.opp) return;
  if (state.me.wantRound > state.me.round && state.opp.wantRound === state.me.wantRound) {
    const nr = state.me.wantRound;
    state.me = { ...state.me, round: nr, wantRound: nr, fleet: emptyFleetState(), actions: [], ready: false };
    state.draft = emptyFleetState(); state.placeIdx = 0; state.mode = "fire"; state.screen = "setup";
    saveMe();
  }
}

function placeAt(idx){
  if (state.placeIdx >= FLEET.length) return;
  const got = canPlace(state.draft.cells, idx, FLEET[state.placeIdx].size, state.horiz);
  if (!got) return;
  const cells = { ...state.draft.cells };
  got.forEach((i) => (cells[i] = state.placeIdx));
  state.draft = { cells, ships: [...state.draft.ships, { id: state.placeIdx, name: FLEET[state.placeIdx].name, size: FLEET[state.placeIdx].size, cells: got }] };
  state.placeIdx++;
  render();
}
function undoLast(){
  if (!state.draft.ships.length) return;
  const ships = state.draft.ships.slice(0, -1);
  const last = state.draft.ships[state.draft.ships.length - 1];
  const cells = { ...state.draft.cells };
  last.cells.forEach((i) => delete cells[i]);
  state.draft = { cells, ships };
  state.placeIdx--;
  render();
}
function confirmFleet(){
  state.me = { ...state.me, fleet: state.draft, ready: true };
  state.screen = "game";
  saveMe(); render();
}
function requestRematch(){
  state.me = { ...state.me, wantRound: state.me.round + 1 };
  saveMe(); handleRematchSync(); render();
}
function act(idx){
  const d = computeDerived();
  if (!state.me || !state.opp || !state.opp.ready) return;
  if (!d.myTurn) return;
  if (state.mode === "fire") {
    if (d.mySummary.resolved.has(idx)) return;
    const hit = state.opp.fleet.cells[idx] !== undefined;
    const action = { type: "fire", center: idx, cells: [idx], hitCells: hit ? [idx] : [], endsTurn: !hit };
    state.me = { ...state.me, actions: [...state.me.actions, action] };
  } else if (state.mode === "bomb") {
    if (d.bombsLeft <= 0) return;
    const cells = boxSquare(idx, 3);
    const hitCells = cells.filter((c) => state.opp.fleet.cells[c] !== undefined);
    const action = { type: "bomb", center: idx, cells, hitCells, endsTurn: hitCells.length === 0 };
    state.me = { ...state.me, actions: [...state.me.actions, action] };
    state.mode = "fire";
  } else if (state.mode === "radar") {
    if (d.radarLeft <= 0) return;
    const cells = boxSquare(idx, RADAR_SIZE);
    const found = cells.some((c) => state.opp.fleet.cells[c] !== undefined && !d.mySummary.hitSet.has(c));
    const action = { type: "radar", center: idx, cells, found, endsTurn: true };
    state.me = { ...state.me, actions: [...state.me.actions, action] };
    state.mode = "fire";
  } else if (state.mode === "multi") {
    if (d.multiLeft <= 0) return;
    const zone = boxSquare(idx, MULTI_ZONE);
    const available = zone.filter((c) => !d.mySummary.resolved.has(c));
    if (available.length === 0) return;
    const cells = shuffle(available).slice(0, MULTI_SHOTS);
    const hitCells = cells.filter((c) => state.opp.fleet.cells[c] !== undefined);
    const action = { type: "multi", center: idx, cells, hitCells, endsTurn: hitCells.length === 0 };
    state.me = { ...state.me, actions: [...state.me.actions, action] };
    state.mode = "fire";
  } else if (state.mode === "torpedo") {
    if (d.torpedoLeft <= 0) return;
    const dir = DIRS[Math.floor(Math.random() * DIRS.length)];
    const sunkSet = new Set(sunkShips(state.opp.fleet, d.mySummary.hitSet).flatMap((s) => s.cells));
    const cells = torpedoPath(idx, dir, state.opp.fleet.cells, sunkSet);
    const hitCells = cells.filter((c) => state.opp.fleet.cells[c] !== undefined && !sunkSet.has(c));
    const action = { type: "torpedo", center: idx, dirName: dir.nome, cells, hitCells, endsTurn: hitCells.length === 0 };
    state.me = { ...state.me, actions: [...state.me.actions, action] };
    state.mode = "fire";
  } else if (state.mode === "sheep") {
    if (d.sheepLeft <= 0) return;
    const unresolved = [];
    for (let c = 0; c < N * N; c++) if (!d.mySummary.resolved.has(c)) unresolved.push(c);
    if (unresolved.length === 0) return;
    const hops = shuffle(unresolved).slice(0, SHEEP_HOPS);
    const blastCenter = Math.floor(Math.random() * N * N);
    const blast = boxSquare(blastCenter, 3);
    const cells = [...new Set([...hops, ...blast])];
    const hitCells = cells.filter((c) => state.opp.fleet.cells[c] !== undefined);
    const newHits = hitCells.filter((c) => !d.mySummary.hitSet.has(c));
    const action = { type: "sheep", center: idx, blastCenter, hops, cells, hitCells, endsTurn: newHits.length === 0 };
    state.me = { ...state.me, actions: [...state.me.actions, action] };
    state.mode = "fire";
  }
  saveMe(); render();
}

/* ============ interfaccia (stringhe HTML) ============ */
function buildGrid({ size, gridId, role, interactive, renderCell }){
  let rows = "";
  for (let r = 0; r < N; r++) {
    rows += `<div class="rowhead">${r + 1}</div>`;
    for (let c = 0; c < N; c++) {
      const i = r * N + c;
      const st = renderCell(i);
      const roleAttr = interactive && role ? `data-role="${role}" data-idx="${i}"` : "";
      const cls = interactive ? "cell cell-live" : "cell";
      rows += `<button type="button" class="${cls}" ${roleAttr} aria-label="${cellName(i)}" style="background:${st.bg};border-color:${st.border || "var(--line)"};color:${st.fg || "var(--ink)"}">${st.mark || ""}</button>`;
    }
  }
  let head = "<div></div>";
  for (const l of COLS) head += `<div class="colhead">${l}</div>`;
  return `<div class="grid-wrap" id="${gridId}" style="max-width:${size}px"><div class="grid">${head}${rows}</div></div>`;
}

function renderHome(){
  return `
    <div class="home-wrap">
      <div class="home-card">
        <h1 class="title-lg">Battaglia navale</h1>
        <p class="muted">Scegliete un codice, scrivetelo tutti e due qui sotto e finite nella stessa partita. Griglia 30×30, con bombe e radar oltre al fuoco normale.</p>
        <label class="label">Codice partita</label>
        <input id="code-input" class="code-input" maxlength="8" placeholder="${state.suggested}" value="${state.codeInputVal}" autocomplete="off">
        <div class="row gap" style="margin-top:14px">
          <button class="btn btn-dark" data-action="join">${state.busy ? "Entro…" : "Entra nella partita"}</button>
          <button class="btn btn-outline" data-action="use-suggested">Usa ${state.suggested}</button>
        </div>
        ${state.msg ? `<p class="err">${state.msg}</p>` : ""}
      </div>
    </div>`;
}

function renderSetup(){
  const done = state.placeIdx >= FLEET.length;
  let groupsHTML = "";
  FLEET_GROUPS.forEach((g) => {
    const placed = Math.min(Math.max(state.placeIdx - g.start, 0), g.count);
    const current = state.placeIdx >= g.start && state.placeIdx <= g.end;
    groupsHTML += `<li class="ship-row ${current ? "current" : ""}"><span>${g.name}<span class="ship-size">${g.size} caselle</span></span><span>${placed}/${g.count}</span></li>`;
  });

  const gridHTML = buildGrid({
    size: 620, gridId: "setup-grid", role: "setup", interactive: !done,
    renderCell: (i) => (state.draft.cells[i] !== undefined ? { bg: "var(--ship)", border: "var(--ship)" } : { bg: "var(--sea)" }),
  });

  const oppLine = state.opp && state.opp.ready ? "L'avversario ha già confermato."
    : state.opp ? "L'avversario sta disponendo le navi."
    : "Nessuno è ancora entrato con questo codice.";

  return `
    <div class="cols">
      <div>${gridHTML}</div>
      <div class="panel-side">
        <h2 class="title-md">Disponi la flotta</h2>
        ${done
          ? `<p class="muted">Flotta completa. Conferma e aspetta l'avversario. In partita avrete anche ${BOMBS_MAX} bombe, ${RADAR_MAX} radar, ${MULTI_MAX} colpo multiplo, ${TORPEDO_MAX} siluri e ${SHEEP_MAX} bombe pecora a testa.</p>`
          : `<p class="muted">Clicca dove vuoi far partire la <b>${FLEET[state.placeIdx].name}</b>, lunghezza ${FLEET[state.placeIdx].size}.</p>`}
        <ul class="ship-list">${groupsHTML}</ul>
        <div class="row gap wrap" style="margin-top:14px">
          <button class="btn btn-outline" data-action="toggle-horiz">${state.horiz ? "Orizzontale" : "Verticale"}</button>
          <button class="btn btn-outline" data-action="undo">Annulla ultima</button>
          <button class="btn btn-outline" data-action="random">Disponi a caso</button>
          <button class="btn btn-outline" data-action="clear">Svuota</button>
        </div>
        <button class="btn btn-block ${done ? "btn-dark" : "btn-disabled"}" data-action="confirm" ${done ? "" : "disabled"}>Conferma la flotta</button>
        <p class="muted small">${oppLine}</p>
      </div>
    </div>`;
}

function fleetTally(titolo, sunkList){
  const righe = FLEET_GROUPS.map((g) => ({
    name: g.name, size: g.size, count: g.count,
    sunk: sunkList.filter((s) => s.name === g.name && s.size === g.size).length,
  }));
  const rimaste = righe.reduce((a, r) => a + (r.count - r.sunk), 0);
  const totale = FLEET.length;
  const rows = righe.map((r) => {
    const done = r.sunk === r.count;
    return `<div class="tally-row${done ? " tally-done" : ""}"><span>${r.name}<span class="tally-size">${r.size} caselle</span></span><span>${r.sunk}/${r.count}</span></div>`;
  }).join("");
  const foot = rimaste === 0 ? "Flotta interamente affondata." : `Ancora in mare: ${rimaste} navi su ${totale}.`;
  return `<div class="tally-block"><p class="label-strong">${titolo}</p>${rows}<p class="muted small">${foot}</p></div>`;
}
function describeMine(a){
  if (!a) return "Nessuna azione ancora.";
  const cn = cellName(a.center);
  if (a.type === "fire") return `Fuoco su ${cn}: ${a.hitCells.length ? "colpito" : "acqua"}.`;
  if (a.type === "bomb") return `Bomba su ${cn}: ${a.hitCells.length} caselle colpite.`;
  if (a.type === "multi") return `Colpo multiplo su ${cn}: ${a.cells.length} bersagli, ${a.hitCells.length} colpiti.`;
  if (a.type === "torpedo") return `Siluro da ${cn} ${a.dirName}: ${a.hitCells.length ? "nave colpita in " + cellName(a.cells[a.cells.length - 1]) : "solo acqua per " + a.cells.length + " caselle"}.`;
  if (a.type === "sheep") return `Bomba pecora: ${a.hops.length} salti ed esplosione vicino a ${cellName(a.blastCenter)}, ${a.hitCells.length} caselle colpite.`;
  return `Radar su ${cn}: ${a.found ? "ci sono navi nei paraggi" : "zona libera"}.`;
}
function describeHostile(a){
  if (!a) return "Non ti hanno ancora attaccato.";
  const cn = cellName(a.center);
  if (a.type === "fire") return `Colpo subìto in ${cn}: ${a.hitCells.length ? "colpito" : "acqua"}.`;
  if (a.type === "multi") return `Colpo multiplo subìto vicino a ${cn}: ${a.hitCells.length} caselle colpite.`;
  if (a.type === "torpedo") return `Siluro subìto da ${cn} ${a.dirName}: ${a.hitCells.length ? "colpito in " + cellName(a.cells[a.cells.length - 1]) : "acqua"}.`;
  if (a.type === "sheep") return `Bomba pecora subìta: ${a.hitCells.length} caselle colpite.`;
  return `Bomba subìta in ${cn}: ${a.hitCells.length} caselle colpite.`;
}

function renderGame(){
  const d = computeDerived();
  const sunkCells = new Set(d.mySunk.flatMap((s) => s.cells));
  const lostCells = new Set(d.lostSunk.flatMap((s) => s.cells));
  const radarMap = radarOverlay(state.me.actions, state.opp && state.opp.fleet ? state.opp.fleet.cells : null, d.mySummary.hitSet);

  let statusText;
  if (!d.bothReady) statusText = "In attesa che l'avversario confermi la flotta.";
  else if (d.winner) statusText = d.winner === state.role ? "Hai vinto." : "Hai perso.";
  else if (d.myTurn) statusText = "Tocca a te: scegli un'azione e una cella nel mare avversario.";
  else statusText = "Sta giocando l'avversario.";

  const myLast = state.me.actions[state.me.actions.length - 1];
  const oppActionsList = state.opp ? state.opp.actions : [];
  const oppLastHostile = [...oppActionsList].reverse().find((a) => a.type === "fire" || a.type === "bomb" || a.type === "multi" || a.type === "torpedo" || a.type === "sheep");

  const attackGrid = buildGrid({
    size: 620, gridId: "attack-grid", role: "attack", interactive: d.myTurn,
    renderCell: (i) => {
      if (sunkCells.has(i)) return { bg: "var(--sunk)", border: "var(--sunk)", fg: "#fff", mark: "×" };
      if (d.mySummary.resolved.has(i)) {
        return d.mySummary.resolved.get(i)
          ? { bg: "var(--hit)", border: "var(--hit)", fg: "#fff", mark: "×" }
          : { bg: "var(--miss)", border: "var(--miss)", fg: "#fff", mark: "·" };
      }
      const rs = radarMap.get(i);
      if (rs === "found") return { bg: "var(--radar-found)" };
      if (rs === "clear") return { bg: "var(--radar-clear)" };
      return { bg: d.myTurn ? "var(--panel)" : "var(--sea)" };
    },
  });

  const defGrid = buildGrid({
    size: 460, gridId: "def-grid", role: null, interactive: false,
    renderCell: (i) => {
      const isShip = state.me.fleet.cells[i] !== undefined;
      if (lostCells.has(i)) return { bg: "var(--sunk)", border: "var(--sunk)", fg: "#fff", mark: "×" };
      if (d.oppSummary.resolved.has(i)) {
        return d.oppSummary.resolved.get(i)
          ? { bg: "var(--hit)", border: "var(--hit)", fg: "#fff", mark: "×" }
          : { bg: "var(--miss)", border: "var(--miss)", fg: "#fff", mark: "·" };
      }
      return isShip ? { bg: "var(--ship)", border: "var(--ship)" } : { bg: "var(--sea)" };
    },
  });

  const modeHint = state.mode === "bomb"
    ? "La bomba colpisce un'area 3×3: ogni casella con una nave risulta colpita."
    : state.mode === "radar"
    ? `Il radar controlla un'area ${RADAR_SIZE}×${RADAR_SIZE} e dice solo se contiene navi non ancora colpite. Quando le colpisci tutte, la sua traccia sparisce.`
    : state.mode === "multi"
    ? `Il colpo multiplo sceglie a caso ${MULTI_SHOTS} celle libere in un'area ${MULTI_ZONE}×${MULTI_ZONE} intorno al punto e le colpisce tutte.`
    : state.mode === "torpedo"
    ? "Il siluro parte dal punto scelto in una direzione casuale e corre fino al bordo, fermandosi alla prima nave: quelle già affondate le attraversa."
    : state.mode === "sheep"
    ? `La bomba pecora salta su ${SHEEP_HOPS} punti casuali della mappa e poi esplode in un 3×3 in un punto casuale. Non si può mirare: è una pecora.`
    : "";

  const rematchAsked = state.me.wantRound > state.me.round;

  return `
    <div class="status-bar" style="border-left-color:${d.winner ? "var(--hit)" : d.myTurn ? "var(--turn)" : "var(--line)"}">
      <span>${statusText}</span>
      <span class="muted status-count">Colpiti ${d.myHits}/${TOT} · subiti ${d.oppHits}/${TOT}</span>
    </div>
    <div class="cols">
      <section>
        <div class="row space-between">
          <h2 class="title-md">Mare avversario</h2>
          <div class="row gap">
            <button class="mode-btn ${state.mode === "fire" ? "active" : ""}" data-action="mode-fire">Fuoco</button>
            <button class="mode-btn ${state.mode === "bomb" ? "active" : ""} ${d.bombsLeft <= 0 ? "disabled" : ""}" data-action="mode-bomb" ${d.bombsLeft <= 0 ? "disabled" : ""}>Bomba <span class="count">${d.bombsLeft}</span></button>
            <button class="mode-btn ${state.mode === "radar" ? "active" : ""} ${d.radarLeft <= 0 ? "disabled" : ""}" data-action="mode-radar" ${d.radarLeft <= 0 ? "disabled" : ""}>Radar <span class="count">${d.radarLeft}</span></button>
            <button class="mode-btn ${state.mode === "multi" ? "active" : ""} ${d.multiLeft <= 0 ? "disabled" : ""}" data-action="mode-multi" ${d.multiLeft <= 0 ? "disabled" : ""}>Colpo multiplo <span class="count">${d.multiLeft}</span></button>
            <button class="mode-btn ${state.mode === "torpedo" ? "active" : ""} ${d.torpedoLeft <= 0 ? "disabled" : ""}" data-action="mode-torpedo" ${d.torpedoLeft <= 0 ? "disabled" : ""}>Siluro <span class="count">${d.torpedoLeft}</span></button>
            <button class="mode-btn ${state.mode === "sheep" ? "active" : ""} ${d.sheepLeft <= 0 ? "disabled" : ""}" data-action="mode-sheep" ${d.sheepLeft <= 0 ? "disabled" : ""}>Bomba pecora <span class="count">${d.sheepLeft}</span></button>
          </div>
        </div>
        <p class="muted">${describeMine(myLast)}</p>
        ${modeHint ? `<p class="muted">${modeHint}</p>` : ""}
        ${attackGrid}
      </section>
      <section>
        <h2 class="title-md">La tua flotta</h2>
        <p class="muted">${describeHostile(oppLastHostile)}</p>
        ${defGrid}
      </section>
      <section class="sunk-panel">
        <h2 class="title-md">Le flotte</h2>
        ${fleetTally("Flotta avversaria (le affondi tu)", d.mySunk)}
        ${fleetTally("La tua flotta", d.lostSunk)}
        ${d.winner ? `<button class="btn ${rematchAsked ? "btn-disabled" : "btn-dark"}" data-action="rematch" ${rematchAsked ? "disabled" : ""} style="margin-top:16px">${rematchAsked ? "In attesa dell'avversario…" : "Rivincita"}</button>` : ""}
      </section>
    </div>`;
}

function render(){
  const app = document.getElementById("app");
  if (state.screen === "home") { app.innerHTML = renderHome(); return; }

  const header = `
    <header class="app-header">
      <h1 class="title-xl">Battaglia navale</h1>
      <div class="meta">
        <span>Partita <strong>${state.code}</strong></span>
        <span>Sei il giocatore ${state.role === "p1" ? "1" : "2"}</span>
      </div>
    </header>`;

  const body = state.screen === "setup" ? renderSetup() : renderGame();
  app.innerHTML = header + body;
}

/* ============ eventi (delegati) ============ */
function handleAction(action){
  switch (action) {
    case "join": { const val = document.getElementById("code-input").value; state.codeInputVal = val; join(val); break; }
    case "use-suggested": state.codeInputVal = state.suggested; render(); break;
    case "toggle-horiz": state.horiz = !state.horiz; render(); break;
    case "undo": undoLast(); break;
    case "random": state.draft = randomFleet(); state.placeIdx = FLEET.length; render(); break;
    case "clear": state.draft = emptyFleetState(); state.placeIdx = 0; render(); break;
    case "confirm": confirmFleet(); break;
    case "mode-fire": state.mode = "fire"; render(); break;
    case "mode-bomb": if (computeDerived().bombsLeft > 0) { state.mode = "bomb"; render(); } break;
    case "mode-radar": if (computeDerived().radarLeft > 0) { state.mode = "radar"; render(); } break;
    case "mode-multi": if (computeDerived().multiLeft > 0) { state.mode = "multi"; render(); } break;
    case "mode-torpedo": if (computeDerived().torpedoLeft > 0) { state.mode = "torpedo"; render(); } break;
    case "mode-sheep": if (computeDerived().sheepLeft > 0) { state.mode = "sheep"; render(); } break;
    case "rematch": requestRematch(); break;
  }
}

document.getElementById("app").addEventListener("click", (e) => {
  const cell = e.target.closest("[data-role]");
  if (cell) {
    const idx = parseInt(cell.getAttribute("data-idx"), 10);
    const role = cell.getAttribute("data-role");
    if (role === "setup") placeAt(idx);
    else if (role === "attack") act(idx);
    return;
  }
  const btn = e.target.closest("[data-action]");
  if (btn) handleAction(btn.getAttribute("data-action"));
});
document.getElementById("app").addEventListener("keydown", (e) => {
  if (e.target && e.target.id === "code-input" && e.key === "Enter") handleAction("join");
});

render();
</script>
</body>
</html>
